name: Windows build and package

on:
  push:
    # Release tags reuse the exact commit already built on the branch.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 / MSVC / portable ZIP
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build, test, package and verify Windows release
        run: |
          New-Item -ItemType Directory -Force build/release/windows/logs | Out-Null
          Start-Transcript -Path build/release/windows/logs/windows-ci.log
          try { ./scripts/ci_windows.ps1 -Jobs 2 }
          finally { Stop-Transcript }
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: HeavenBench-windows-x64
          path: |
            build/packages/windows/*.zip
            build/packages/windows/*.sha256
          if-no-files-found: error
      - name: Upload build and verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HeavenBench-windows-x64-logs
          path: |
            build/release/windows/logs/
            build/renderer-windows/host-preflight/
          if-no-files-found: ignore
